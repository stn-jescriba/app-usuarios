services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Configura SQLSERVER_SA_PASSWORD}
    volumes:
      - sql-data:/var/opt/mssql
  users-api:
    build: ./backend
    environment:
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?Configura la conexión SQL Server del contenedor}
      AllowedOrigins__0: http://localhost:5173
    ports:
      - "5080:8080"
    depends_on:
      - sqlserver
  users-web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5080
    ports:
      - "5173:8080"
    depends_on:
      - users-api
volumes:
  sql-data:
